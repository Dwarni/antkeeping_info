{% load i18n static %}
<div class="dropdown d-inline-block position-relative notification-bell-wrapper">
    <button class="btn btn-link nav-link p-2 rounded-circle d-inline-flex align-items-center justify-content-center position-relative text-white-50 hover-white"
            type="button"
            id="notificationBellButton-{{ suffix|default:'default' }}"
            data-bs-toggle="dropdown"
            data-bs-auto-close="outside"
            aria-expanded="false"
            aria-label="{% trans 'Notifications' %}"
            title="{% trans 'Notifications' %}"
            hx-get="{% url 'notifications:dropdown' %}"
            hx-target="#notificationDropdownContent-{{ suffix|default:'default' }}"
            hx-trigger="click">
        <i class="bi bi-bell-fill fs-5" aria-hidden="true"></i>
        <span class="notification-badge-container position-absolute top-0 start-100"
              hx-get="{% url 'notifications:badge' %}"
              hx-trigger="load, every 60s, visibilitychange[document.visibilityState=='visible'] from:document"
              hx-target="this"
              hx-swap="innerHTML">
            {% include "notifications/snippets/badge.html" with unread_count=0 %}
        </span>
    </button>

    <div class="dropdown-menu dropdown-menu-end shadow-lg border p-0 notification-dropdown-menu"
         aria-labelledby="notificationBellButton-{{ suffix|default:'default' }}"
         style="width: 360px; max-width: 92vw; border-radius: 0.75rem; overflow: hidden; z-index: 1050;">
        <div id="notificationDropdownContent-{{ suffix|default:'default' }}" class="notification-dropdown-content">
            <div class="p-4 text-center text-body-secondary">
                <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                <p class="mb-0 small text-body-secondary">{% trans "Loading notifications..." %}</p>
            </div>
        </div>
    </div>
</div>
