{% load i18n %}
<div class="mb-2 journal-photo-picker" data-max-files="{{ photo_picker_max|default:'6' }}">
    <label class="form-label small fw-semibold">{{ photo_picker_label|default:"Photos (optional)" }}</label>
    <div class="d-flex flex-wrap gap-2 photo-picker-thumbs">
        <button type="button" class="photo-picker-add-tile" title="{{ photo_picker_button_title|default:'Add photos' }}" aria-label="{{ photo_picker_button_title|default:'Add photos' }}">
            <i class="bi bi-plus-lg"></i>
        </button>
    </div>
    <input type="file" name="{{ photo_picker_name|default:'images' }}" accept="image/*" {% if photo_picker_max != "1" %}multiple{% endif %} class="d-none photo-picker-file-input">
    <p class="form-text mb-0 photo-picker-hint">
        {% if photo_picker_hint %}
            {{ photo_picker_hint }}
        {% else %}
            {% trans "Add up to 6 photos. Drag to reorder, drop files here, or paste from clipboard (Ctrl+V)." %}
        {% endif %}
    </p>
</div>
