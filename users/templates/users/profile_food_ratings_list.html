{% load i18n %}
{% if not food_ratings %}
<p class="text-muted small">{% trans "You haven't voted on any foods yet." %}</p>
{% else %}
<ul class="list-group mb-4">
  {% for r in food_ratings %}
  <li class="list-group-item">
    <a href="{% url 'ant_detail' r.species.slug %}#food-ratings-section"><em>{{ r.species.name }}</em></a>
    &mdash; {{ r.food_item.name }}
    &mdash;
    <span class="fw-semibold {% if r.vote == 1 %}text-success{% else %}text-danger{% endif %}">
      <i class="bi bi-hand-thumbs-{% if r.vote == 1 %}up{% else %}down{% endif %}-fill"></i>
      {{ r.get_vote_display }}
    </span>
    <span class="text-muted small">{{ r.updated_at|date:"N j, Y" }}</span>
  </li>
  {% endfor %}
</ul>
{% endif %}
